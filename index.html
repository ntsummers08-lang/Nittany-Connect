 <div class="socialPostBody"><div class="socialPostActions"><button class="${liked?'heartOn':''}" onclick="socialToggleLike('${esc(p.id)}')" aria-label="${liked?'Unlike post':'Like post'}">${liked?'♥':'♡'}</button><button onclick="socialFocusComment('${esc(p.id)}')" aria-label="Comment">▤</button><button onclick="toggleFavorite(${org.id})" aria-label="Favorite organization">${favorites.includes(org.id)?'★':'☆'}</button><span class="socialPostAge">${p.age||'New demo post'}</span></div>
 <div class="socialCaption"><b>${esc(org.title)}</b> ${esc(p.caption)}</div><div class="socialFeedback">${liked?'You liked this · ':''}${c.length?c.length+' demo comment'+(c.length===1?'':'s'):'Be the first to comment'}</div>
 ${c.slice(-3).map(t=>`<div class="socialComment"><b>Demo Student</b> ${esc(t)}</div>`).join('')}
 <div class="socialCommentBar"><input id="comment-${esc(p.id)}" maxlength="140" placeholder="Add a demo comment…" aria-label="Comment on ${esc(org.title)}" onkeydown="if(event.key==='Enter')socialAddComment('${esc(p.id)}')"><button onclick="socialAddComment('${esc(p.id)}')">Post</button></div>
 </div></article>`;
}
function renderSocial(){
 const search=(document.getElementById('search')?.value||'').trim().toLowerCase();
 const posts=allSocialPosts().filter(p=>(socialClubFilter==='all'||p.orgId===socialClubFilter)&&(!search||[getClub(p.orgId)?.title,p.caption,p.headline].join(' ').toLowerCase().includes(search)));
 const clubs=[...new Set(allSocialPosts().map(p=>p.orgId))].map(id=>getClub(id)).filter(Boolean);
 const heading='<div class="eyebrow">CAMPUS CONTENT · DESIGN DEMO</div><div class="heading"><div><h1>Club Posts.</h1><p>Discover campus life through photos, short videos, and club stories.</p></div></div>';
 document.getElementById('content').innerHTML=heading+`<div class="socialNotice"><b>Concept feature, not a live social network.</b> All example posts are fictional. Your uploads, likes and comments stay on this device. Real organizations have not posted these updates.</div>
 <div class="socialActionsHeader"><div><h2>Discover their world</h2><p>Stories from communities that could become your own.</p></div><button class="solidaction" onclick="socialOpenComposer()">＋ Create demo post</button></div>
 <div class="socialStories"><button class="socialStory ${socialClubFilter==='all'?'chosen':''}" onclick="socialFilter('all')"><div class="storyRing"><span>✦</span></div><b>All posts</b></button>${clubs.map(org=>`<button class="socialStory ${socialClubFilter===org.id?'chosen':''}" onclick="socialFilter(${org.id})"><div class="storyRing"><span>${org.icon}</span></div><b>${esc(org.title)}</b></button>`).join('')}</div>
 <div class="socialFeedLayout"><div class="socialFeed">${posts.length?posts.map(socialPostCard).join(''):'<div class="empty">No demo posts for this club yet. Create one using the button above.</div>'}</div>
 <aside class="socialRail"><div class="socialSidePanel"><span class="eyebrow">YOUR CAMPUS FEED</span><h3>Meet the clubs behind the posts</h3><p>Like a post, explore an organization, or create a mock photo/video update to demonstrate how Nittany Connect could work.</p><button class="edit" onclick="navigate('explore');filter='Groups';render()">Explore all clubs ↗</button></div><div class="socialSidePanel"><b>Media demo notes</b><p>Photos and short videos are stored in your browser where supported. Files are not sent online or shared with other students.</p></div></aside></div>`;
 hydrateSocialMedia();
}
function socialToggleLike(id){socialLikes=socialLikes.includes(id)?socialLikes.filter(x=>x!==id):[...socialLikes,id];persist('nc_social_likes',socialLikes);render();}
function socialFocusComment(id){document.getElementById('comment-'+id)?.focus();}
function socialAddComment(id){const el=document.getElementById('comment-'+id);if(!el)return;const t=el.value.trim();if(!t)return;socialComments[id]=[...(socialComments[id]||[]),t].slice(-15);persist('nc_social_comments',socialComments);render();}
function socialOpenComposer(){
 composeMediaFile=null;activeComposer=true;
 const orgs=items.filter(x=>x.type==='Student organization'&&!x.demo).sort((a,b)=>a.title.localeCompare(b.title));
 document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Create fictional club post"><button class="close" onclick="socialCloseComposer()" aria-label="Close">×</button><div class="eyebrow">CLUB STUDIO · DEMONSTRATION</div><h2>Create a club post</h2><p>Mock up how a club could share photos and short videos with students. No account is created and nothing is published online.</p><label class="composerLabel" for="composerOrg">Choose a club to demonstrate</label><select class="composerSelect" id="composerOrg">${orgs.map(o=>`<option value="${o.id}" ${o.id===socialClubFilter?'selected':''}>${esc(o.title)}</option>`).join('')}</select>
 <label class="composerLabel" for="composerCaption">Caption</label><textarea class="composerText" maxlength="300" id="composerCaption" rows="4" placeholder="What's happening with your club?"></textarea>
 <label class="composerLabel" for="composerFile">Photo or video (optional)</label><input class="composerInput" type="file" id="composerFile" accept="image/*,video/*" onchange="socialChooseFile(this)"><div class="composerPreview" id="composerPreview">Add a photo or video to preview it here. Videos are limited to 60 seconds and 15 MB.</div>
 <button id="composerSubmit" class="primary" onclick="socialSubmitPost()">Add demonstration post ↗</button><p class="subtle">Files remain on this device in browser storage where supported. Do not upload private photos for class demonstrations.</p></div></div>`;
}
function socialCloseComposer(){if(composePreviewUrl){URL.revokeObjectURL(composePreviewUrl);composePreviewUrl=null;}composeMediaFile=null;activeComposer=false;closeModal();}
async function socialChooseFile(el){
 const file=el.files?.[0];const preview=document.getElementById('composerPreview');composeMediaFile=null;
 if(composePreviewUrl){URL.revokeObjectURL(composePreviewUrl);composePreviewUrl=null;}
 if(!file){preview.textContent='No media selected.';return;}
 if(!/^(image|video)\//.test(file.type)){preview.textContent='Choose an image or video file.';el.value='';return;}
 if(file.size>15*1024*1024){preview.textContent='File too large. Choose a file under 15 MB.';el.value='';return;}
 const url=URL.createObjectURL(file);composePreviewUrl=url;
 if(file.type.startsWith('video/')){
  const test=document.createElement('video');test.preload='metadata';test.src=url;
  await new Promise(resolve=>{test.onloadedmetadata=resolve;test.onerror=resolve;setTimeout(resolve,3500)});
  if(!Number.isFinite(test.duration)||test.duration>60){preview.textContent='Use a short video under 60 seconds.';el.value='';URL.revokeObjectURL(url);composePreviewUrl=null;return;}
  preview.innerHTML='<video controls playsinline src="'+esc(url)+'"></video>';
 }else preview.innerHTML='<img src="'+esc(url)+'" alt="Preview your photo">';
 composeMediaFile=file;
}
async function socialSubmitPost(){
 const caption=document.getElementById('composerCaption')?.value.trim()||'';
 const orgId=Number(document.getElementById('composerOrg')?.value);
 if(!caption){notify('Write a caption before posting');return;}
 if(!getClub(orgId)){notify('Choose a club');return;}
 const submit=document.getElementById('composerSubmit');if(submit){submit.disabled=true;submit.textContent='Saving post…';}
 const id='local-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
 const post={id,orgId,kind:'local',caption:caption.slice(0,300),createdAt:new Date().toISOString(),age:'Created on this device',icon:getClub(orgId).icon,headline:'Your club story',theme:getClub(orgId).style};
 if(composeMediaFile){const key='post-'+id;const stored=await socialStoreMedia(key,composeMediaFile);
  if(stored){post.mediaKey=key;post.mediaType=composeMediaFile.type.startsWith('video/')?'video':'image';}
  else {notify('Browser media storage unavailable: saved the caption only.');}
 }
 demoPosts.unshift(post);persist('nc_social_posts',demoPosts);socialClubFilter='all';socialCloseComposer();page='social';render();notify('Demo club post added locally!');
}
function clubMediaBlurb(x){return `<section class="clubInProfile"><h3>Club posts & updates</h3><p>See fictional concept posts or create a local photo/video demonstration for this organization.</p><button class="solidaction" onclick="openClubPosts(${x.id})">View club posts ↗</button></section>`;}

window.addEventListener('keydown',e=>{if(e.key==='Escape'&&answers.connections&&document.getElementById('modalRoot').innerHTML&&!draft)closeModal()});
render();if(!answers.connections)startSurvey();
</script></body></html>
