const radarSafeUrl=url=>{try{const x=new URL(String(url));return x.protocol==='https:'?x.href:null}catch(e){return null}};
const radarSanitizeList=arr=>Array.isArray(arr)?arr.filter(x=>typeof x==='string').map(x=>x.slice(0,80)).slice(0,12):[];
function radarNormalize(raw){
 if(!raw||typeof raw!=='object')return null;
 const title=String(raw.title||'').trim().slice(0,170),date=String(raw.date||'').slice(0,10),endDate=String(raw.endDate||raw.date||'').slice(0,10);
 if(!title||!/^\d{4}-\d\d-\d\d$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))return null;
 const url=radarSafeUrl(raw.officialUrl||raw.sourceUrl||'');
 const base=title+'|'+date;let h=2166136261;for(let i=0;i<base.length;i++){h^=base.charCodeAt(i);h=Math.imul(h,16777619)}
 const tags=radarSanitizeList(raw.tags||raw.interests);
 const interests=tags.filter(t=>questions[0].options.includes(t));
 const eventChoices=questions[2].options;
 const eventTags=tags.filter(t=>eventChoices.includes(t));
 const mapped=interests.length?interests:['Music & Arts'];
 const style=interests.includes('Sports & Fitness')?'soccer':interests.includes('Gaming & Technology')?'tech':interests.includes('Outdoor Activities')?'outdoors':interests.includes('Food & Culture')?'food':interests.includes('Volunteering')?'outdoors':'music';
 const icon=interests.includes('Sports & Fitness')?'🏟️':interests.includes('Gaming & Technology')?'🎮':interests.includes('Outdoor Activities')?'🌿':interests.includes('Food & Culture')?'🍜':interests.includes('Volunteering')?'🤝':'🎭';
 const start=typeof raw.startTime==='string'&&/^\d\d:\d\d$/.test(raw.startTime)?raw.startTime:'';
 const isDemo=raw.demo===true;
 return {id:1000000+(h>>>0),type:'Event',title,category:String(raw.category||'Campus event').slice(0,90),date,endDate:/^\d{4}-\d\d-\d\d$/.test(endDate)?endDate:date,
  startTime:start||null,endTime:typeof raw.endTime==='string'?raw.endTime.slice(0,30):null,location:String(raw.location||'Location not confirmed').slice(0,180),
  time:date+' · '+(start?start+' (local time)':'Time not verified'),desc:String(raw.description||raw.desc||'View the organizer listing for more details.').slice(0,550),
  organizer:String(raw.organizer||'Organizer not confirmed').slice(0,120),cost:String(raw.cost||'Ticket details not confirmed').slice(0,110),
  officialUrl:url,source:url?new URL(url).hostname:'No official source link supplied',verified:Boolean(raw.verified)&&Boolean(url)&&!isDemo,
  status:'approved',demo:isDemo,live:true,icon,style,interests:mapped,events:eventTags.length?eventTags:['Social Events'],
  goals:radarSanitizeList(raw.goals).length?radarSanitizeList(raw.goals):['Explore New Interests','Make New Friends'],
  tags,slot:questions[6].options.includes(raw.slot)?raw.slot:'',size:['Small','Medium','Large'].includes(raw.size)?raw.size:'Unknown',
  frequency:'Occasionally',major:[],novelty:'New'};
}
function radarRefreshItems(){
 const merged=new Map(); [...radarRemote,...radarApproved].forEach(r=>{const x=radarNormalize(r);if(x)merged.set(radarStableKey(x),x)});
 items.splice(radarInitialCount,items.length-radarInitialCount,...merged.values());
}
function radarQueue(rows){let keys=new Set([...radarPending,...radarApproved,...radarRemote].map(radarStableKey).concat(radarRejected));let added=0;
 for(const raw of rows){const x=radarNormalize(raw);if(!x)continue;const k=radarStableKey(x);if(!keys.has(k)){radarPending.push({...raw,title:x.title,date:x.date,officialUrl:x.officialUrl,location:x.location,description:x.desc,demo:x.demo});keys.add(k);added++}}
 persist('nc_radar_pending',radarPending);return added;
}
async function radarFetchRemote(){
 if(location.protocol==='file:'){radarStatus='offline';if(page==='radar')render();return false}
 radarStatus='checking';if(page==='radar')render();let ok=false;
 try{
  const [ap,pe]=await Promise.all([fetch('data/approved-events.json',{cache:'no-store'}),fetch('data/pending-events.json',{cache:'no-store'})]);
  if(ap.ok){const data=await ap.json();radarRemote=radarArray(data).filter(x=>x&&x.demo!==true&&radarSafeUrl(x.officialUrl));ok=true;radarRefreshItems()}
  if(pe.ok){const data=await pe.json();radarQueue(radarArray(data))}
  radarStatus=ok?'connected':'not-configured';if(ok){radarLastSync=new Date().toISOString();persist('nc_radar_last_sync',radarLastSync)}
 }catch(e){radarStatus='unavailable'}
 if(page==='radar'||page==='home'||page==='explore'||page==='saved'||page==='profile')render();return ok;
}

function radarReview(key,action){const idx=radarPending.findIndex(x=>radarStableKey(x)===key);if(idx<0)return;let x=radarPending[idx];
 if(action==='approve'&&!x.demo&&!radarSafeUrl(x.officialUrl)){notify('An official HTTPS event link is required before approval');return}
 if(action==='approve'&&!x.demo&&!x.verified&&!confirm('This event is not independently verified by the research script. Publish with an unverified label?'))return;
 radarPending.splice(idx,1);
 if(action==='approve'){x={...x,reviewedAt:new Date().toISOString()};radarApproved.push(x);persist('nc_radar_approved',radarApproved);radarRefreshItems();notify('Event added to personalized recommendations')}
 else{radarRejected.push(key);persist('nc_radar_rejected',radarRejected);notify('Candidate removed from review queue')}
 persist('nc_radar_pending',radarPending);render();
}
function radarDownload(){const exportEvents=[...radarRemote,...radarApproved].filter(x=>!x.demo && radarSafeUrl(x.officialUrl)).map(x=>({title:x.title,date:x.date,endDate:x.endDate||x.date,startTime:x.startTime||null,endTime:x.endTime||null,location:x.location,category:x.category,description:x.description||x.desc,organizer:x.organizer,cost:x.cost||null,tags:x.tags||x.interests,officialUrl:x.officialUrl,verified:!!x.verified}));
 const unique=[...new Map(exportEvents.map(x=>[radarStableKey(x),x])).values()];
 const blob=new Blob([JSON.stringify({updatedAt:new Date().toISOString(),events:unique},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='approved-events.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify(`${unique.length} non-demo events exported`);

function finishSurvey(){answers=structuredCopy(draft);persist('nc_answers',answers);ncStorage.removeItem('nc_draft');draft=null;closeModal();page='home';filter='All';document.getElementById('search').value='';render();window.scrollTo(0,0);notify('Your personalized recommendations are ready!')}
function closeModal(){detailId=null;document.getElementById('modalRoot').innerHTML=''}
function detail(id){const x=items.find(a=>a.id===id);if(!x)return;detailId=id;let allowed=answers.connections!=='No, Just Recommend Events and Clubs';document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(x.title)} details"><button class="close" onclick="closeModal()" aria-label="Close details">×</button><div class="detailTop">${x.icon}</div><span class="demo">${x.demo?'SAMPLE LISTING · DEMO SCHEDULE':x.live?(x.verified?'EVENT RADAR · SOURCE CHECKED':'EVENT RADAR · UNVERIFIED'):x.verified?'OFFICIAL EVENT DETAILS VERIFIED':'SCHEDULE / DETAILS UNVERIFIED'}</span><div class="eyebrow" style="margin-top:17px">${x.type} · ✦ ${match(x)}% MATCH</div><h2>${esc(x.title)}</h2><p>${esc(x.desc)}</p><div class="detailInfo"><div>📍 ${esc(x.location)}</div><div>🗓️ ${esc(x.time)} ${x.demo?'(illustrative only)':''}</div><div>✨ ${esc(why(x))}</div><div>👥 ${x.size==='Unknown'?'Group size not verified':esc(x.size)+' group'} · ${x.frequency==='Unknown'?'Meeting frequency not verified':esc(x.frequency)}</div>${x.type==='Student organization'?`<div>📌 ${esc(x.category||'Student group')}</div><div>👋 Membership access: ${x.openMembership===null?'Not verified — contact the organization':esc(x.openMembership)}</div><div>🎯 Activities: ${esc(x.activities||'Ask the organization for details')}</div><div>🎓 Who might enjoy it: ${esc(x.audience||'Interested students')}</div>`:`<div>🎟️ ${esc(x.cost||'Ticket information not available')}</div><div>🏛️ Organizer: ${esc(x.organizer||'Not verified')}</div><div>⏳ Ends: ${esc(x.endTime||'End time not available')}</div>`}<div>ℹ️ ${esc(x.source||'Sample prototype content')}</div>${x.officialUrl?`<div>🔗 <a href="${esc(x.officialUrl)}" target="_blank" rel="noopener noreferrer">Official listing / organizer page ↗</a></div>`:'<div>🔗 Official direct listing not verified. Check Penn State Discover or the organizer.</div>'}</div><div class="detailButtons"><button class="secondary" onclick="toggleSave(${id})">${saved.includes(id)?'♥ Saved':'♡ Save'}</button>${x.type==='Student organization'?`<button class="secondary" onclick="toggleFavorite(${id})">${favorites.includes(id)?'♥ Favorited':'♡ Favorite org'}</button>`:''}<button class="primary" onclick="join(${id})">${joined.includes(id)?'✓ Interested':'I’m interested'}</button></div>${x.type==='Event'?`<section class="profilePanel"><h3>Find Someone to Go With</h3><p>Connect with fictional students who are also interested in this example event.</p>${allowed?`<span class="connectBadge">${answers.connections==='Yes'?'Connections enabled':'Approval required for connections'}</span>${students.filter((s,i)=>i===(id%4)||i===((id+1)%4)||i===((id+2)%4)).map((s,i)=>`<div class="studentRow"><div class="studentBubble">${s.name.split(' ').map(w=>w[0]).join('')}</div><div><b>${esc(s.name)}</b><p>${esc(s.major)} · Shared: ${esc(s.interests.filter(t=>(answers.interests||[]).includes(t)).join(', ')||'Open to new interests')}</p><button class="edit" onclick="studentProfile('${s.name}')">View profile</button></div><button onclick="sendRequest('${s.name}',${id})">${requests.includes(id+':'+s.name)?'✓ Requested':'Connect +'}</button></div>`).join('')}`:`<p class="smallHint">You chose not to connect with other students. Your profile is hidden from this demonstration connection feature, and requests are disabled. You can change this in your survey.</p><button class="edit" onclick="startSurvey()">Change connection preferences</button>`}</section>`:''}<p class="subtle" style="text-align:center">Prototype only · No real accounts, messages, registrations, or live listings</p></div></div>`}
function studentProfile(name){const s=students.find(a=>a.name===name);if(!s)return;const id=detailId;document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><button class="close" onclick="detail(${id})">×</button><div class="studentBubble" style="width:65px;height:65px;font-size:22px">${s.name.split(' ').map(w=>w[0]).join('')}</div><h2>${esc(s.name)}</h2><p>Fictional student · ${esc(s.major)}</p><h3>Interests</h3><div class="chips">${s.interests.map(t=>`<span class="chip sel">${esc(t)}</span>`).join('')}</div><p>Shared interests: ${esc(s.interests.filter(t=>(answers.interests||[]).includes(t)).join(', ')||'You could explore something new together.')}</p><button class="primary" onclick="sendRequest('${s.name}',${id});detail(${id})">${requests.includes(id+':'+s.name)?'✓ Request sent':'Send simulated connection request'}</button><button class="secondary" style="width:100%;margin-top:10px" onclick="detail(${id})">← Back to event</button></div></div>`}
function sendRequest(name,id){if(answers.connections==='No, Just Recommend Events and Clubs')return;let key=id+':'+name;if(!requests.includes(key)){requests.push(key);persist('nc_requests',requests);notify('Simulated request sent to '+name)}detail(id)}
function resetDemo(){if(!confirm('Reset all demo survey answers, saved items, favorites, and requests?'))return;['nc_answers','nc_draft','nc_saved','nc_joined','nc_favorites','nc_requests','nc_interests','nc_setup','nc_radar_approved','nc_radar_pending','nc_radar_rejected','nc_radar_last_sync'].forEach(k=>ncStorage.removeItem(k));answers={};draft=null;saved=[];joined=[];favorites=[];requests=[];radarApproved=[];radarPending=[];radarRejected=[];radarLastSync=null;radarRefreshItems();page='home';render();startSurvey()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&answers.connections&&document.getElementById('modalRoot').innerHTML&&!draft)closeModal()});
radarApproved=radarApproved.filter(x=>radarNormalize(x));radarPending=radarPending.filter(x=>radarNormalize(x));radarRefreshItems();render();if(!answers.connections)startSurvey();radarFetchRemote();
</script></body></html>
