name: Nittany Connect event research

on:
  workflow_dispatch:
  schedule:
    # Every six hours (UTC). Local Eastern clock shifts with daylight saving time.
    - cron: '13 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: nittany-event-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out application
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate research functions
        run: python -m unittest discover -s tests
      - name: Research public event pages
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NC_RESEARCH_MODEL: gpt-5-mini
        run: python scripts/research_events.py --days 45
      - name: Commit research candidates (manual approval only)
        run: |
          git config user.name 'nittany-event-radar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pending-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update pending event research queue'
            git push
          fi
